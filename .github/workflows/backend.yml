# The v2 game server (backend/): test, build a static Linux binary, and attach it to the GitHub Release of
# a v* tag. The game server machine has no Rust toolchain; deploy/update.sh downloads the binary from there.
name: backend

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: write   # creating the release and uploading its assets

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  ASSET: anistock-x86_64-linux-musl

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (Rust stable + musl)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Test
        run: cargo test --locked

      - name: Build the static binary
        # rusqlite's bundled SQLite is compiled with musl-gcc (musl-tools)
        run: cargo build --release --locked --target "$TARGET" --bin anistock

      - name: Package
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/anistock" "dist/$ASSET"
          file "dist/$ASSET"
          # must not depend on the server's libc
          if ldd "dist/$ASSET" 2>&1 | grep -q '=>'; then echo "not statically linked" >&2; exit 1; fi
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256" && cat "$ASSET.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            backend/dist/${{ env.ASSET }}
            backend/dist/${{ env.ASSET }}.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" \
                 --notes "Game server $TAG. Install or update on the server: bash deploy/update.sh"
          gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
