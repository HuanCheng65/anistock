# AniStock simulation parameters. Currency unit is the abstract in-game "币".
# Every number here is a design knob; the point of the sim is to tune them.

seed = 42

[window]
start = "2026-07-01"          # must not precede the earliest season fully loaded in the DB
end = ""                      # empty = last complete day in the data

[universe]
formats = ["TV", "TV_SHORT", "ONA"]
min_popularity = 3000         # AniList popularity (list adds) at the end of the window
ipo_lead_days = 21            # list this many days before the first episode airs

[markets]
# revenue_i = demand * Σ weight_m * share_i,m ; share is within each market's own universe.
# us = AniList (daily, observed), cn = Bangumi episode comments, jp = Annict episode watch logs
# (cn/jp rebuilt weekly from per-episode snapshots, see sim/reconstruct.py)
us = 0.3
cn = 0.5
jp = 0.2

[economy]
players = 60
initial_cash = 100000         # per player

[revenue]
# attention_i,day = w_in_progress * inProgress/7 + w_new_adds * Δpopularity + w_trending * trending
# inProgress is a stock full of stale lists (One Piece: 485k "watching" vs ~29k weekly activity),
# so active watching is measured by trending (daily list activity) instead
w_in_progress = 0.0
w_new_adds = 2.0
w_trending = 1.0
score_ref = 70                # AniList averageScore that gets multiplier 1.0
score_power = 2.0
score_mult_min = 0.7
score_mult_max = 1.4
# total external demand per week = base * (total attention / attention at window start) ^ elasticity
demand_base_week = 120000
demand_elasticity = 0.5

[company]
shares = 10000
ipo_discount = 0.10           # IPO priced at fundamental value minus this (classic IPO underpricing)
ipo_price_min = 0.1
ipo_float = 0.25              # share of the company sold for cash at IPO (A-share minimum public float)
production_fee_ratio = 0.8    # share of the IPO raise paid out as production fee (to households)
corp_tax = 0.25
payout_ratio = 0.6            # dividends paid weekly out of after-tax profit
dividend_tax = 0.10           # effective average of the holding-period schedule

[valuation]
equity_premium = 0.08         # annual, added to the policy rate for discounting
# weekly revenue after the last episode, as a multiple of a typical airing week.
# Measured on 30 finished Summer 2026 TV shows (AniList trending, median): the old single
# decay of 0.85/week implied ~5.7 weeks of tail; the data says ~1.7.
post_finale_profile = [0.40, 0.30, 0.22, 0.16, 0.14]
post_finale_tail_decay = 0.78  # per week after the profile runs out
long_runner_decay = 0.995     # weekly decay for long-runners (first aired > long_runner_years ago)
long_runner_years = 2
default_episodes = 13         # assumed length when AniList has no episode count yet
min_remaining_weeks = 4       # unknown-length shows still airing are assumed to run at least this long
# pre-air expectation per market = per-member rate x audience (weekly attention once airing)
preair_attention_per_user = 1.09 # AniList list entries the day before premiere -> weekly attention in weeks 2-3 (median of 123 shows; lists double in the first 3 weeks)
preair_cn_per_member = 0.0156    # Bangumi 想看+在看+看过 -> weekly episode comments (median of 77 airing shows)
preair_jp_per_member = 0.226     # Annict watchers -> weekly watch logs (median of 66 airing shows)
# audiences come from today's snapshot: in the replay this peeks at the future (flagged in the report);
# in the live game the same numbers are observed every day before airing
# in-season decay (measured): Annict ep1->2 0.95, later 0.98/ep; Bangumi comments ep1->2 0.78, later flat
premiere_drop = 0.85
in_season_retention = 0.98
min_days_after_premiere = 2      # keep the pre-air estimate until this many days of real revenue exist

[market]
# daily: p += kappa*(V-p) + mu*(p-p_prev) + sigma*p*eps, capped at ±limit
kappa = 0.15
mu = 0.30
sigma = 0.03
limit = 0.10
gap_sigma = 0.01              # overnight gap: open = previous close x (1 + noise)
ipo_free_days = 5             # A-share registration rule: no price limit for the first 5 trading days
airing_free_days = 0          # game-rule option: no price limit for N days after the first episode (off)
daily_turnover = 0.02         # share of market cap traded per day
stamp_duty = 0.0005

[government]
transfer_ratio = 0.5          # share of weekly tax receipts paid back to households

[central_bank]
r_neutral = 0.03              # annual
r_min = 0.0
r_max = 0.20
k_money = 0.5                 # rate response to (M2 growth - target)
m2_growth_target = 0.20       # annualised
max_step = 0.0025             # per weekly decision
growth_lookback_days = 28     # M2 growth the rule reacts to: annualised over this many days
deposit_spread = 0.01         # deposits earn policy rate minus this
bill_share_base = 0.10        # share of household liquid wealth held in central bank bills at r_neutral
bill_share_slope = 4.0        # extra bill share per unit of (r - r_neutral)
bill_share_max = 0.6
bill_adjust_speed = 0.1       # fraction of the gap closed per day
