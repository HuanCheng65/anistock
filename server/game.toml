# AniStock game configuration.
# Economic parameters start from the simulation's recommended file and are overridden below,
# so the game and the simulation share one source of truth.

base_params = "sim/params_recommended.toml"

[overrides]
# sizing (docs/game-design.md, "规模"): median share ~5 币, public float ~0.7x of 40 players' cash
"revenue.demand_base_week" = 2500000
"company.shares" = 10000
"company.ipo_float" = 0.25
"company.founder_share" = 0.75
"company.fees_leave_economy" = true
"company.operating_cost_ratio" = 0.5
"company.payout_ratio" = 0.9

[game]
timezone = "Asia/Shanghai"
initial_cash = 100000          # 币 per new player
trading_open = "09:00"
trading_close = "23:00"
daily_step_at = "06:30"        # after the collector (06:00)
price_limit = 0.10
ipo_free_days = 5
airing_free_days = 0           # club decision: no limit in the premiere week (off)
commission = 0.00025
stamp_duty = 0.0005
dividend_tax = [[7, 0.20], [91, 0.10], [100000, 0.0]]   # [max holding days, rate]
transfer_ratio = 0.25          # share of weekly taxes paid back to players equally
delist_after_weeks = 8         # finished and earning under delist_revenue_share for this many weeks
delist_revenue_share = 0.0005  # of total weekly revenue
min_listing_popularity = 3000  # AniList list entries

[npc]
market_maker_cash = 30000      # 币 per market maker (one per stock)
noise_traders = 6
noise_trader_cash = 50000
tick_seconds = 20
mm_spread = 0.02               # base quoted spread
mm_quote_frac = 0.01           # each quote size, as a share of the company's shares
mm_value_noise = 0.05          # daily noise on the market maker's private estimate
mm_anchor_to_price = 0.3       # weight of the last trade price in its reference price
mm_inventory_skew = 0.3        # quotes move this much (x) as inventory goes from target to empty / double
committee_sell_above = 1.3     # rights holders sell when price > value x this
committee_sell_frac = 0.002    # of shares per tick, at most
noise_trade_prob = 0.15        # per tick per noise trader
