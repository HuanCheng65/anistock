# AniStock game configuration.
# Economic parameters start from the simulation's recommended file and are overridden below,
# so the game and the simulation share one source of truth.

base_params = "sim/params_recommended.toml"

[overrides]
# sizing (docs/game-design.md, "规模"): median share ~5 币, public float ~0.7x of 40 players' cash
"revenue.demand_base_week" = 2500000
# absolute revenue (docs/v2-series.md §6) once the platform size averages two seasons of the collector's history
"revenue.platform_min_days" = 182
"company.shares" = 10000
"company.ipo_float" = 0.25
"company.founder_share" = 0.75
"company.fees_leave_economy" = true
"company.operating_cost_ratio" = 0.5
"company.payout_ratio" = 0.9
# equity premium, annual, added to the policy rate when discounting dividends (sim/params_recommended.toml has
# the broad-market 0.08). Raised for risk: every stock here is a very small, very volatile company that may be
# delisted, so holding stocks earns about 5% a season over transfers (docs/game-design.md ⚠️).
"valuation.equity_premium" = 0.30

[game]
timezone = "Asia/Shanghai"
initial_cash = 100000          # 币 per new player
auction_start = "08:45"        # opening auction (集合竞价): orders collect, one price at trading_open
trading_open = "09:00"
trading_close = "04:00"        # the next morning: one trading day runs 09:00 to 04:00 (late-night anime airs 22:00-01:00)
day_rollover = "04:00"         # the trading day changes here, like a gacha game's 4 AM reset (orders, trades, candles, today)
daily_step_at = "06:30"        # after the collector (06:00)
# no daily price limit; Hong Kong-style volatility control instead (see server/exchange.py Rules)
vcm_threshold = 0.10           # first trigger: a trade >10% away from the price 5 minutes ago
vcm_window_min = 5
vcm_cool_min = 5               # cooling-off length; later triggers anchor on the day's open at ±20%, ±30%...
commission = 0.00025
stamp_duty = 0.0005
dividend_tax = [[0, 0.20], [27, 0.10], [100000, 0.0]]  # [max holding days, inclusive]: same day 20%, under 4 weeks 10%, 4 weeks+ 0
transfer_ratio = 0.25          # share of weekly taxes paid back to players equally
delist_after_weeks = 8         # finished and earning under delist_revenue_share for this many weeks
delist_revenue_share = 0.0005  # of total weekly revenue
min_listing_popularity = 3000  # AniList list entries
# IPO: Hong Kong-style public offer with ballot and clawback (公开发售 + 抽签 + 回拨)
ipo_subscription_days = 3      # subscription window, ending the day before listing
ipo_public_base = 0.5          # share of the float offered to players (HK base is 10%; scaled up for a small club)
ipo_clawback = [[15, 0.7], [50, 0.8], [100, 0.9]]   # [oversubscription multiple, public share of the float]
# 破产重整 (voluntary, once per season): total assets under this share of initial_cash may sell every holding
# to the world account at the last price and top cash up to initial_cash; the 总榜 return stays chain-linked
restructure_threshold = 0.1

[npc]
market_maker_cash = 30000      # 币 per market maker (one per stock)
noise_traders = 6
noise_trader_cash = 50000
tick_seconds = 20
mm_spread = 0.02               # base quoted spread
mm_quote_frac = 0.01           # each quote size, as a share of the company's shares
mm_value_noise = 0.05          # daily noise on the market maker's private estimate
mm_anchor_to_price = 0.3       # weight of the last trade price in its reference price
mm_inventory_skew = 0.3        # quotes move this much (x) as inventory goes from target to empty / double
committee_sell_above = 1.3     # rights holders sell when price > value x this
committee_sell_frac = 0.002    # of shares per tick, at most
noise_trade_prob = 0.15        # per tick per noise trader

[market]
# v2 NPC market (docs/v2-npc-market.md; Rust server only, the v1 Python server ignores this section).
# Calibrated in simulation (backend: marketsim); every key not listed keeps its default in
# backend/src/market/config.rs. On since v0.3.0 (false: the v1 NPCs, npc.rs).
enabled = true
seed = 20261105
n_value = 720                  # population (§2); 3x value agents since v0.3.4: with a price-anchored
                               # market maker the value agents alone pull prices to value
grow_cash_scale = 0.33         # agents added to a running population start with a third of the cash
n_trend = 120
n_news = 60
n_retail = 180
heat_alpha = 0.3               # watch lists and stock choice ∝ heat^alpha
rate_value = 4.0               # actions per hour at intraday factor 1 (§3)
rate_trend = 1.5
rate_news = 0.3
rate_retail = 3.0
curve = [0.5, 1.0, 1.3, 0.9, 1.2, 2.0]   # auction, morning, lunch, afternoon, 18-20h, 20-23h
curve_night = [2.4, 1.0]       # 23-02h (anime has just aired), 02-04h
bias_sigma = 0.05              # spread of the value agents' views (§4)
bias_half_life_days = 4.0
event_shock = 0.12             # belief shift of a magnitude-10 official event
mm_target_frac = 0.2           # market maker keeps 20% of the float (§8)
# Designated market maker (v0.3.4, liquidity study in docs/v2-npc-market.md §11): quotes around the market
# price (not the hidden value), stock lent by the rights holders, a minimum quote size, size skew by inventory,
# wider and smaller around scheduled information
mm_anchor_to_price = 1.0
mm_loan_frac = 0.2             # rights holders lend 20% of the shares to the market maker
mm_cash = 50000.0
mm_rate = 20.0
mm_base_spread = 0.006
mm_vol_mult = 2.0
mm_quote_frac = 0.005
mm_quote_min = 1500.0          # a quote unit is at least 1,500 币 (level k quotes k units)
mm_levels = 5
mm_level_step = 0.5
mm_inventory_skew = 0.0        # no price shading (it compounds with a last-price anchor) ...
mm_size_skew = 0.7             # ... the size skews instead
mm_inventory_cap = 3.0
mm_toxicity_mult = 2.0
mm_event_widen = 2.0           # air windows, fresh events, the first half hour
# adaptive liquidity (adapt_*, docs/v2-npc-market.md §11) stays off
fund_floor = 0.3               # fund flows (§6)
fund_ceiling = 1.2
fund_weekly_cap = 0.1
# Sentiment layer batch 1 (docs/v2-sentiment.md): acts only through retail, trend and news agents' orders, never
# on the hidden value. Random strengths, durations and occurrences are hashed from the seed and the server
# secret (deterministic, survive restarts, not computable from this file).
sentiment_strength = 0.15      # market sentiment (Baker–Wurgler), daily AR(1), half-life 14 days: at +1 sd the
                               # average stock's retail buy share 50% -> 57% and sizes +16%; cold stocks up to
                               # 4x as sensitive as hot ones; bands 冷淡/平稳/火热 at ±0.67 sd (quartiles)
attention = 0.25               # attention buying (Barber–Odean): retail buy share 62% at a mean-strength episode
attention_rank_n = 6           # 上热榜 = the market page's top-6 gainers / losers lists
reaction = true                # under/over-reaction (Barberis–Shleifer–Vishny) of the news agents to revisions

[api.rate_limit]
# API v1 token buckets (docs/api-v1.md §2.12): requests per second and burst per subject
player_rps = 10
player_burst = 20
bot_rps = 30
bot_burst = 60
anon_rps = 10
anon_burst = 20
auth_per_min = 10             # login / register per IP
bind_per_hour = 5             # bind-code redemptions per QQ number
ws_per_ip = 8                 # concurrent WebSocket connections per IP

[api.events]
# bot events (docs/api-v1.md §5.3.7): big_move thresholds
big_move_daily = 0.10         # |change vs prev close| crosses each multiple of this
big_move_window = 0.05        # |change vs the price window_min minutes ago|
big_move_window_min = 30

[margin]
# 融资融券 (docs/v2-margin.md §11). These are the defaults in backend/src/margin.rs; change a value here to override it.
enabled = true
min_days = 7              # days since registration before credit can be opened
min_assets = 0.5          # net assets at least this share of initial_cash
listed_days = 5           # a stock is marginable this many days after listing
haircut = 0.7             # collateral value of a marginable stock (折算率)
margin_ratio = 1.0        # initial margin for financing and short sales (保证金比例)
interest_spread = 0.03    # financing rate = policy rate + this
fee_spread = 0.05         # lending fee = policy rate + this
call_ratio = 1.3          # margin call at the daily close (追保线)
liquidate_ratio = 1.1     # immediate forced liquidation intraday (平仓线)
target_ratio = 1.5        # forced liquidation stops here
protect = 0.05            # liquidation orders: limit at last price x (1 -/+ protect)
lend_frac = 0.5           # the rights holders lend at most this share of their stock (held + lent)
stock_cap = 0.25          # per stock: financing balance / short interest at most this share of the float
concentration = 1.0       # one stock's financing + short value at most this multiple of net assets
npc_short_frac = 0.3      # share of value agents that may sell short
npc_short_extra = 0.10    # extra mispricing a value agent needs before shorting (beyond its buy threshold)
npc_short_size = 0.10     # one short position at most this share of the agent's wealth
