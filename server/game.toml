# AniStock game configuration.
# Economic parameters start from the simulation's recommended file and are overridden below,
# so the game and the simulation share one source of truth.

base_params = "sim/params_recommended.toml"

[overrides]
# sizing (docs/game-design.md, "规模"): median share ~5 币, public float ~0.7x of 40 players' cash
# phase 1: 2,500,000 × 0.648. The long tail roughly doubles a show's value; the documented sizing (docs/game-design.md
# §4: stocks and cash of the same order, all NPC and market-maker capital calibrated at that size) is kept by scaling
# demand so that the market's total hidden value on the switch day equals the old model's (replay, 2026-07-08:
# old ÷ new = 0.648 over the 68 companies valued in both; cross-check 2026-10-01: 0.625). The relative values of
# airing and finished shows still come from the new model.
"revenue.demand_base_week" = 1620000
# absolute revenue (docs/design/series.md §6) once the platform size averages two seasons of the collector's history
"revenue.platform_min_days" = 182
# the us platform's days before the live collector covered every airing work (it started 2026-11-05 and backfilled only
# the works it met): rebuilt from AniList's trends of every airing work (sim/platform_history.py; a file in data/derived,
# copied to the server like the Bangumi archive). With it the trailing year is complete and the switch is not waiting.
"revenue.platform_history" = "platform_us.json"
# phase 1 switches (docs/design/series.md §12): absolute revenue on since 2026-11-09 (docs/ops/switch-cn-views.md; cn/jp
# platform sizes fixed, us the trailing year); the sequel option needs the AniList relations the collector has only
# just started to keep: off for now.
# impute_tail: cn/jp days without data (after the finale, and in season) earn the value's own expectation (the §4.2 stopgap)
"revenue.absolute_revenue" = 1
# the cn market's series (sim/reconstruct.py build): "comments" (episode comments) or "views" (Bangumi viewers rebuilt
# from collection counts, engine/cn_views.py). Switch together with valuation.preair_cn_per_member (comments 0.0156,
# views 0.632: weekly views per Bangumi audience member at the premiere, 62 shows of summer-autumn 2026) and the
# refitted filter: the cn prior of every show with a pre-air Bangumi snapshot is in the series' units.
"revenue.cn_model" = "views"
"valuation.preair_cn_per_member" = 0.707
# fixed platform sizes for cn and jp (engine/daily_inputs.py platform_size): their trailing totals follow the collector's
# coverage, not the platforms (Bangumi as a whole is flat; Annict has no site-wide figure); the switch's scale per market
# carries the units. us keeps the trailing year of AniList, whose coverage (every show with 3000+ list entries) is stable.
"revenue.platform_fixed_cn" = 10000.0
"revenue.platform_fixed_jp" = 1000.0
# the cn market's revenue at the switch ÷ the relative rule's: the long runners and Chinese works only the viewer-based
# cn series measures (2.4% of the listed shows' cn attention, Oct 9 – Nov 7 2026) earn on top instead of taking it
# from the seasonal shows (sim/research/cn_views/, daily.rs platform_switch)
"revenue.absolute_cn_coverage" = 1.024
"valuation.sequel_option" = 0
"valuation.impute_tail" = 1
"company.shares" = 10000
"company.ipo_float" = 0.25
"company.founder_share" = 0.75
"company.fees_leave_economy" = true
"company.operating_cost_ratio" = 0.5
"company.payout_ratio" = 0.9
# equity premium, annual, added to the policy rate when discounting dividends (sim/params_recommended.toml has
# the broad-market 0.08). Raised for risk: every stock here is a very small, very volatile company that may be
# delisted, so holding stocks earns about 5% a season over transfers (docs/game-design.md ⚠️).
"valuation.equity_premium" = 0.30

[game]
timezone = "Asia/Shanghai"
initial_cash = 100000          # 币 per new player
auction_start = "08:45"        # opening auction (集合竞价): orders collect, one price at trading_open
trading_open = "09:00"
trading_close = "04:00"        # the next morning: one trading day runs 09:00 to 04:00 (late-night anime airs 22:00-01:00)
day_rollover = "04:00"         # the trading day changes here, like a gacha game's 4 AM reset (orders, trades, candles, today)
daily_step_at = "06:30"        # after the collector (06:00)
# no daily price limit; Hong Kong-style volatility control instead (see server/exchange.py Rules)
vcm_threshold = 0.10           # first trigger: a trade >10% away from the price 5 minutes ago
vcm_window_min = 5
vcm_cool_min = 5               # cooling-off length; later triggers anchor on the day's open at ±20%, ±30%...
commission = 0.00025
stamp_duty = 0.0005
dividend_tax = [[0, 0.20], [27, 0.10], [100000, 0.0]]  # [max holding days, inclusive]: same day 20%, under 4 weeks 10%, 4 weeks+ 0
transfer_ratio = 0.25          # share of weekly taxes paid back to players equally
delist_after_weeks = 8         # finished and earning under delist_revenue_share for this many weeks
delist_revenue_share = 0.0005  # of total weekly revenue
min_listing_popularity = 3000  # AniList list entries
# IPO: Hong Kong-style public offer with ballot and clawback (公开发售 + 抽签 + 回拨)
ipo_subscription_days = 3      # subscription window, ending the day before listing
ipo_public_base = 0.5          # share of the float offered to players (HK base is 10%; scaled up for a small club)
ipo_clawback = [[15, 0.7], [50, 0.8], [100, 0.9]]   # [oversubscription multiple, public share of the float]
# 破产重整 (voluntary, once per season): total assets under this share of initial_cash may sell every holding
# to the world account at the last price and top cash up to initial_cash; the 总榜 return stays chain-linked
restructure_threshold = 0.1

[npc]
market_maker_cash = 30000      # 币 per market maker (one per stock)
noise_traders = 6
noise_trader_cash = 50000
tick_seconds = 20
mm_spread = 0.02               # base quoted spread
mm_quote_frac = 0.01           # each quote size, as a share of the company's shares
mm_value_noise = 0.05          # daily noise on the market maker's private estimate
mm_anchor_to_price = 0.3       # weight of the last trade price in its reference price
mm_inventory_skew = 0.3        # quotes move this much (x) as inventory goes from target to empty / double
committee_sell_above = 1.3     # rights holders sell when price > value x this
committee_sell_frac = 0.002    # of shares per tick, at most
noise_trade_prob = 0.15        # per tick per noise trader

[market]
# v2 NPC market (docs/design/npc-market.md; Rust server only, the v1 Python server ignores this section).
# Calibrated in simulation (backend: marketsim); every key not listed keeps its default in
# backend/src/market/config.rs. On since v0.3.0 (false: the v1 NPCs, npc.rs).
enabled = true
seed = 20261105
n_value = 720                  # population (§2); 3x value agents since v0.3.4: with a price-anchored
                               # market maker the value agents alone pull prices to value
grow_cash_scale = 0.33         # agents added to a running population start with a third of the cash
n_trend = 120
n_news = 60
n_retail = 180
heat_alpha = 0.3               # watch lists and stock choice ∝ heat^alpha
rate_value = 4.0               # actions per hour at intraday factor 1 (§3)
rate_trend = 1.5
rate_news = 0.3
rate_retail = 3.0
# the opening auction is busy (4x): with 0.5 it crossed on 17% of days and the candle's open was mostly the first
# continuous trade into a thin book, 4% of days off by over 5% and reverted within the day; at 4x it crosses on 46%,
# the open carries 95% of the overnight revision (74%), those outliers fall by about 40%; daily volatility, spreads
# and volume unchanged (replay 2026-11-07, data/fast/an/opens.py)
curve = [4.0, 1.0, 1.3, 0.9, 1.2, 2.0]   # auction, morning, lunch, afternoon, 18-20h, 20-23h
curve_night = [2.4, 1.0]       # 23-02h (anime has just aired), 02-04h
bias_sigma = 0.05              # spread of the value agents' views (§4)
bias_half_life_days = 4.0
event_shock = 0.12             # belief shift of a magnitude-10 official event
mm_target_frac = 0.2           # market maker keeps 20% of the float (§8)
# Designated market maker (v0.3.4, liquidity study in docs/design/npc-market.md §11): quotes around the market
# price (not the hidden value), stock lent by the rights holders, a minimum quote size, size skew by inventory,
# wider and smaller around scheduled information
mm_anchor_to_price = 1.0
mm_follow_revisions = true     # quotes move with each revision of the public value (热度快讯, the hourly updates, the
                               # close) until the price trades on it: a dealer requotes on public news at once
                               # (Glosten–Milgrom), or scripts pick off its stale quotes (docs/design/api-access.md §7)
mm_loan_frac = 0.2             # rights holders lend 20% of the shares to the market maker; also the most it
                               # sells short from the lending pool once its inventory is gone
mm_cash = 50000.0
mm_rate = 20.0
mm_base_spread = 0.006
mm_vol_mult = 2.0
mm_vol_roll = true             # volatility net of bid-ask bounce (Roll 1984): from trade prices the market maker's
                               # own spread fed back into its volatility estimate (5-min sd 1.5% in the hottest stocks,
                               # half-spread 1.4%), docs/design/npc-market.md §13
mm_quote_frac = 0.005
mm_quote_min = 1500.0          # a quote unit is at least 1,500 币 (level k quotes k units)
mm_levels = 5
mm_level_step = 0.5
mm_inventory_skew = 0.0        # no price shading (it compounds with a last-price anchor) ...
mm_size_skew = 0.7             # ... the size skews instead
mm_inventory_cap = 3.0
mm_toxicity_mult = 2.0
mm_event_widen = 2.0           # air windows, fresh events, the first half hour
# adaptive liquidity (adapt_*, docs/design/npc-market.md §11) stays off
fund_floor = 0.3               # fund flows (§6)
fund_ceiling = 1.2
fund_weekly_cap = 0.1
# Sentiment layer batch 1 (docs/design/sentiment.md): acts only through retail, trend and news agents' orders, never
# on the hidden value. Random strengths, durations and occurrences are hashed from the seed and the server
# secret (deterministic, survive restarts, not computable from this file).
sentiment_strength = 0.15      # market sentiment (Baker–Wurgler), daily AR(1), half-life 14 days: at +1 sd the
                               # average stock's retail buy share 50% -> 57% and sizes +16%; cold stocks up to
                               # 4x as sensitive as hot ones; bands 冷淡/平稳/火热 at ±0.67 sd (quartiles)
attention = 0.25               # attention buying (Barber–Odean): retail buy share 62% at a mean-strength episode
attention_rank_n = 6           # 上热榜 = the market page's top-6 gainers / losers lists
reaction = true                # under/over-reaction (Barberis–Shleifer–Vishny) of the news agents to revisions
# Sentiment layer batch 2 (docs/design/sentiment.md §7)
bubble_prob = 0.5              # positive-feedback bubbles (De Long et al.): a run (5-close return >= 25%, about two sd of
                               # a 5-session return at the replay's 5% daily sd) in a stock at least average heat becomes a
                               # bubble half the time (Greenwood–Shleifer–You 2019: 21 of 40 100% run-ups crashed);
                               # strength log-normal mean 1, constant-hazard burst (mean life 1-5 days, at most 7)
disposition_ratio = 1.0        # disposition effect OFF (code kept; 1.5 = Odean 1998 PGR 0.148 / PLR 0.098). On, it
                               # breaks the bounded-deviation criterion for cold stocks in hot-sentiment seasons:
                               # docs/design/sentiment.md §7.3

[api.rate_limit]
# API v1 token buckets (docs/api-v1.md §2.12): requests per second and burst per subject
player_rps = 10
player_burst = 20
bot_rps = 30
bot_burst = 60
anon_rps = 10
anon_burst = 20
auth_per_min = 10             # login / register per IP (an IPv6 address counts by its /64)
register_per_ip_day = 20      # successful registrations per IP per day, on top of auth_per_min (campus NAT)
bind_per_hour = 5             # bind-code redemptions per QQ number
ws_per_ip = 64                # concurrent WebSocket connections per IP (campus NAT shares one address)
ws_total = 5000               # concurrent WebSocket connections, site-wide (LimitNOFILE in the service is above it)
ws_per_account = 3            # concurrent WebSocket connections opened with API keys, per account (docs/design/api-access.md)
order_rps = 5                 # placing / cancelling orders per account, web and API keys together (also counts above)
order_burst = 10
orders_per_day = 5000         # orders an account may place in a trading day
max_open_orders = 100         # open orders at once, per account
max_open_orders_per_stock = 20
hash_concurrency = 2          # password hashes (scrypt, ~50 ms each) at a time; a login waits up to 5 s for a slot

[api.cache]
# shared answers for the endpoints every client polls (backend/src/api/v1/cache.rs)
market_secs = 3               # quotes and indices: rebuilt on any trade, ledger entry or close, else at most this old
leaderboard_secs = 30         # the leaderboard reads every player: rebuilt at most this often (0 = every request)

[api.pow]
# proof of work for register / login (docs/design/account.md §3.2): the browser finds n in [0, max) with
# PBKDF2-SHA-256(n, salt, cost) = target. register_max = 0 turns it off.
cost = 5000
register_max = 1000           # about 1-2 s on a mid-range phone (measure before launch)
login_max = 1000              # login needs a proof only while surging
surge_per_min = 60            # register + login attempts per minute, site-wide, that start a surge
surge_factor = 4              # register's max multiplier while surging
cooldown_secs = 600           # a surge lasts this long after the last minute over the threshold
expires_secs = 300            # a challenge is valid this long

[account]
# who may register (docs/design/account.md §3.1): open, invite (needs ANISTOCK_INVITE), closed.
# ANISTOCK_REGISTRATION in .env overrides this.
registration = "invite"

[account.eligibility]
# what 身份验证 (a QQ binding today; crate::kyc) and activity unlock (docs/design/account.md §4)
require_kyc = true
transfer_min_days = 7          # 财政补贴: registered at least this many days
transfer_active_days = 28      # 财政补贴: a trade in this many days
ipo_mv_days = 5                # 新股认购: quota = mean holdings value over this many closed trading days
ipo_quota_ratio = 1.0          #   × this (A-share 市值配售)
rank_min_days = 0              # 排行榜: registered at least this many days (身份验证 already keeps alts off)
rank_min_trades = 1            # 排行榜: trades so far (1 = has traded at all; 身份验证 already keeps alts off)
credit_min_level = 4           # 融资融券: 风险测评 C4 积极型 or above (and the knowledge test, the margin disclosure)
assessment_valid_days = 90     # a 风险测评 counts about a season
assessment_per_day = 3         # 风险测评 / knowledge tests a day, each

[account.documents]
# current versions of 用户协议, 隐私政策, 风险揭示书 (texts: web/src/legal/). Raise one after a material change:
# every player then accepts it again (signs, for the disclosure) before the next order.
terms = 1
privacy = 1
disclosure = 1
margin_disclosure = 1          # 融资融券风险揭示书: signed before opening credit
api_disclosure = 1             # 程序化交易风险揭示书: signed before an API key may trade
futures_disclosure = 1         # 热度期货风险揭示书: signed before trading futures

[news]
# external news from the news-feed stock extension (docs/design/news.md): shadow = archived only (calibration);
# publish = also a game news item (category 媒体), no effect on the market
mode = "publish"

[api]
# API keys with the `trade` scope (docs/design/api-access.md phase 2). Off: keys stay read-only, and existing
# trade keys stop trading at once (ANISTOCK_API_TRADING=0 overrides without a commit).
trading = true                 # opened 2026-11-07 with v0.6.10

[api.events]
# bot events (docs/api-v1.md §5.3.7): big_move thresholds
big_move_daily = 0.10         # |change vs prev close| crosses each multiple of this
big_move_window = 0.05        # |change vs the price window_min minutes ago|
big_move_window_min = 30

[margin]
# 融资融券 (docs/design/margin.md §11). These are the defaults in backend/src/margin.rs; change a value here to override it.
enabled = true
min_days = 0              # days since registration before credit can be opened (A-share: 6 months). 0: opening
                          # needs 身份验证 instead, which keeps throwaway accounts out (docs/design/account.md §6)
min_assets = 0.5          # net assets at least this share of initial_cash
listed_days = 5           # a stock is marginable this many days after listing
haircut = 0.7             # collateral value of a marginable stock (折算率)
margin_ratio = 1.0        # initial margin for financing and short sales (保证金比例)
interest_spread = 0.03    # financing rate = policy rate + this
fee_spread = 0.05         # lending fee = policy rate + this
call_ratio = 1.3          # margin call at the daily close (追保线)
liquidate_ratio = 1.1     # immediate forced liquidation intraday (平仓线)
target_ratio = 1.5        # forced liquidation stops here
protect = 0.05            # liquidation orders: limit at last price x (1 -/+ protect)
lend_frac = 0.5           # the rights holders lend at most this share of their stock (held + lent)
stock_cap = 0.25          # per stock: financing balance / short interest at most this share of the float
concentration = 1.0       # one stock's financing + short value at most this multiple of net assets
npc_short_frac = 0.3      # share of value agents that may sell short
npc_short_extra = 0.10    # extra mispricing a value agent needs before shorting (beyond its buy threshold)
npc_short_size = 0.10     # one short position at most this share of the agent's wealth

[corporate]
# Company capital policy (docs/design/corporate.md §3; Rust server only). Every key not listed keeps its default in
# backend/src/corporate.rs.
enabled = true
split_above = 100.0          # 币: a close above this ...
split_days = 5               # ... this many trading days in a row announces a split (one share above a small order)
split_ratios = [2, 3, 4, 5, 10]  # k-for-1, the post-split price closest to the market's median close
split_lead_days = 7          # announcement to the first day in new units
rights_price = 0.8           # rights price: the announcement day's close x this
rights_max_ratio = 0.3       # at most 3 new shares per 10
rights_days = 3              # subscription days; the record, payment and issue at the last one's close
buyback_min = 0.01           # idle cash at least this share of the market value ...
buyback_under_days = 20      # ... and the close under the value this many closes in a row
buyback_days = 91            # programme length
buyback_adv = 0.25           # a day at most this share of the average daily volume (SEC Rule 10b-18)
buyback_adv_days = 20
buyback_every_min = 10
buyback_quiet_min = 30       # no buying this long after the open and before the close

# 热度期货 (docs/design/futures.md §4): the other values are the code's defaults (backend/src/futures/rules.rs), the ones
# the replay gate passed. Needs a server binary with futures (v0.7.0+): an older one cannot read this table.
[futures]
enabled = true
# heat index v2 (2026-11-09, docs/ops/switch-cn-views.md): every contract still open settles at this trading day's
# settlement price on its close, so nobody gains or loses from the change of the index's units
terminate_on = "2026-11-09"

# 指数基金 (docs/v3-funds.md): the eight funds of crate::indices, the other values the code's defaults
# (backend/src/funds/mod.rs, the ones the replay ran). Turn on with a server binary that has the fund tables (V24).
[funds]
enabled = true
